<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08111f">
<title>シス単 1–1200 Quiz</title>
<style>
:root{--bg:#07101d;--bg2:#0c1728;--panel:#101c2f;--panel2:#15243a;--line:#2b3d56;--text:#f8fafc;--muted:#9fb0c5;--accent:#e2e8f0;--ok:#34d399;--ng:#fb7185;--gold:#fbbf24;--blue:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -20%,#1b3152 0,#0b1627 36%,#050c16 82%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
body{min-height:100vh;min-height:100dvh}
button,input,select{font:inherit}
button{cursor:pointer}
.shell{width:min(760px,100%);margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 14px}
.brand h1{font-size:21px;margin:0;letter-spacing:.02em}.brand small{color:var(--muted)}
.card{background:rgba(15,27,46,.96);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 22px 70px rgba(0,0,0,.28)}
.hidden{display:none!important}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.metric{background:#0a1424;border:1px solid #22354f;border-radius:15px;padding:11px 8px;text-align:center}.metric b{display:block;font-size:20px}.metric span{color:var(--muted);font-size:11px}
.sectionTitle{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;margin:15px 2px 8px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.preset{background:#0b1728;color:#dce8f6;border:1px solid #2a3e59;border-radius:12px;padding:10px 4px;font-weight:700;font-size:13px}
.preset.active{background:#e8eef7;color:#07101d;border-color:#e8eef7}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;color:var(--muted);font-size:11px;margin:0 0 5px 2px}
.field input,.field select{width:100%;background:#091525;color:var(--text);border:1px solid #2a3e59;border-radius:12px;padding:12px 11px;outline:none}
.toggleRow{display:flex;justify-content:space-between;align-items:center;background:#091525;border:1px solid #2a3e59;border-radius:13px;padding:11px 12px;margin-top:10px}.toggleRow span{font-size:14px}.toggleRow input{width:22px;height:22px}
.primary{width:100%;border:0;border-radius:15px;background:#f1f5f9;color:#07101d;padding:15px 14px;font-weight:900;margin-top:16px;font-size:16px}
.secondary{width:100%;border:1px solid #344b68;border-radius:14px;background:#13223a;color:#f8fafc;padding:13px 12px;font-weight:800}
.miniActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.danger{color:#fecdd3;border-color:#6d3040;background:#251522}
.note{color:#7f93ad;font-size:11px;line-height:1.55;margin:12px 3px 0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.top b{color:#fff}
.progress{height:7px;border-radius:99px;background:#07101d;overflow:hidden;margin:13px 0 22px}.progress div{height:100%;background:#f8fafc;width:0;transition:width .22s}
.wordNo{text-align:center;color:#7f93ad;font-size:12px}.word{text-align:center;font-size:clamp(34px,9vw,54px);font-weight:900;letter-spacing:-.035em;margin:6px 0 23px;word-break:break-word}
.choices{display:grid;gap:10px}.choice{min-height:58px;text-align:left;border:1px solid #2b405d;background:#091525;color:#f8fafc;border-radius:15px;padding:13px 14px;line-height:1.45;font-weight:700}
.choice.correct{border-color:#34d399;background:rgba(52,211,153,.15)}.choice.wrong{border-color:#fb7185;background:rgba(251,113,133,.14)}.choice:disabled{opacity:1}
.feedback{min-height:45px;text-align:center;margin:13px 0 2px;font-weight:800;line-height:1.4}.feedback.ok{color:#6ee7b7}.feedback.ng{color:#fda4af}
.nextBtn{display:none;width:100%;margin-top:8px;border:0;border-radius:14px;padding:13px;background:#e2e8f0;color:#07101d;font-weight:900}.nextBtn.show{display:block}
.statsLine{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:12px}.statsLine b{color:#fff}
.resultPct{text-align:center;font-size:56px;font-weight:950;letter-spacing:-.04em;margin:8px 0 0}.resultSub{text-align:center;color:var(--muted);margin:0 0 16px}
.resultGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}
.wrongList{display:grid;gap:8px;max-height:340px;overflow:auto;padding-right:2px}.wrongItem{display:grid;grid-template-columns:116px 1fr;gap:8px;background:#091525;border:1px solid #263b56;border-radius:12px;padding:10px 11px;font-size:13px}.wrongItem b{word-break:break-word}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid #2d4664;background:#0a1728;border-radius:999px;padding:4px 8px;font-size:11px;color:#b9cae0}
.masteryLegend{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#e2e8f0;color:#07101d;padding:10px 13px;border-radius:12px;font-weight:800;font-size:13px;box-shadow:0 8px 30px #0008;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1}
@media(max-width:520px){.presets{grid-template-columns:repeat(3,1fr)}.card{padding:15px;border-radius:20px}.wrongItem{grid-template-columns:100px 1fr}}
</style>
</head>
<body>
<div class="shell">
  <div class="brand"><h1>シス単 1–1200 Quiz</h1><small>英語 → 日本語</small></div>

  <section id="setup" class="card">
    <div class="summary">
      <div class="metric"><b id="masteredCount">0</b><span>習得済み</span></div>
      <div class="metric"><b id="learningCount">0</b><span>学習中</span></div>
      <div class="metric"><b id="totalAccuracy">—</b><span>累計正答率</span></div>
    </div>

    <div class="sectionTitle">出題範囲</div>
    <div class="presets" id="presets">
      <button class="preset active" data-s="1" data-e="1200">1–1200</button>
      <button class="preset" data-s="1" data-e="200">1–200</button>
      <button class="preset" data-s="201" data-e="400">201–400</button>
      <button class="preset" data-s="401" data-e="600">401–600</button>
      <button class="preset" data-s="601" data-e="800">601–800</button>
      <button class="preset" data-s="801" data-e="1000">801–1000</button>
      <button class="preset" data-s="1001" data-e="1200">1001–1200</button>
    </div>
    <div class="fields" style="margin-top:10px">
      <div class="field"><label>開始番号</label><input id="startNo" type="number" min="1" max="1200" value="1"></div>
      <div class="field"><label>終了番号</label><input id="endNo" type="number" min="1" max="1200" value="1200"></div>
    </div>

    <div class="sectionTitle">出題設定</div>
    <div class="fields">
      <div class="field"><label>問題数</label><select id="questionCount"><option>10</option><option>20</option><option selected>30</option><option>50</option><option>100</option><option value="99999">範囲内すべて</option></select></div>
      <div class="field"><label>出題方法</label><select id="mode"><option value="random">ランダム</option><option value="weak">苦手・未習得優先</option><option value="number">番号順</option></select></div>
    </div>
    <label class="toggleRow"><span>正解後、自動で次へ</span><input id="autoNext" type="checkbox" checked></label>

    <button id="startBtn" class="primary">スタート</button>
    <div class="miniActions">
      <button id="lastWrongBtn" class="secondary">前回の間違い</button>
      <button id="weakBtn" class="secondary">未習得だけ</button>
    </div>

    <div class="sectionTitle">進捗データ</div>
    <div class="miniActions">
      <button id="exportBtn" class="secondary">進捗を書き出す</button>
      <label class="secondary" style="display:flex;align-items:center;justify-content:center;cursor:pointer">進捗を読み込む<input id="importInput" type="file" accept="application/json" hidden></label>
    </div>
    <button id="resetBtn" class="secondary danger" style="margin-top:9px">学習履歴をリセット</button>
    <div class="masteryLegend"><span class="badge">3回連続正解＝習得</span><span class="badge">間違えると連続記録リセット</span></div>
    <div class="note">※ 学習履歴はこのWebサイトを開いたブラウザ内に保存されます。別端末・別URLへ移すときは「進捗を書き出す」を使えます。</div>
  </section>

  <section id="quiz" class="card hidden">
    <div class="top"><span id="qIndex">1 / 30</span><span>🔥 <b id="combo">0</b> COMBO</span></div>
    <div class="progress"><div id="bar"></div></div>
    <div class="wordNo" id="wordNo">No.1</div>
    <div class="word" id="word">follow</div>
    <div id="choices" class="choices"></div>
    <div id="feedback" class="feedback"></div>
    <button id="nextBtn" class="nextBtn">次の問題</button>
    <div class="statsLine"><span>正解 <b id="sessionCorrect">0</b></span><span>不正解 <b id="sessionWrong">0</b></span><span>正答率 <b id="sessionAccuracy">—</b></span></div>
  </section>

  <section id="result" class="card hidden">
    <div class="sectionTitle" style="text-align:center;margin-top:2px">RESULT</div>
    <div id="resultPct" class="resultPct">0%</div>
    <div id="resultSub" class="resultSub"></div>
    <div class="resultGrid">
      <div class="metric"><b id="resultCorrect">0</b><span>正解</span></div>
      <div class="metric"><b id="resultWrong">0</b><span>不正解</span></div>
      <div class="metric"><b id="resultCombo">0</b><span>最大コンボ</span></div>
    </div>
    <div id="wrongSection">
      <div class="sectionTitle">間違えた単語</div>
      <div id="wrongList" class="wrongList"></div>
    </div>
    <div class="miniActions" style="margin-top:16px"><button id="retryWrongBtn" class="secondary">間違いだけ再挑戦</button><button id="backBtn" class="primary" style="margin:0">設定へ戻る</button></div>
  </section>
</div>
<div id="toast" class="toast"></div>

d":1130,"en":"striking","ja":"いちじるしい"},{"id":1131,"en":"adequate","ja":"十分な"},{"id":1132,"en":"extraordinary","ja":"並外れた"},{"id":1133,"en":"odd","ja":"おかしな"},{"id":1134,"en":"abstract","ja":"抽象的な"},{"id":1135,"en":"mutual","ja":"相互の"},{"id":1136,"en":"excessive","ja":"過度の"},{"id":1137,"en":"ashamed","ja":"恥ずかしい"},{"id":1138,"en":"tremendous","ja":"とてつもない"},{"id":1139,"en":"inevitable","ja":"避けられない"},{"id":1140,"en":"pure","ja":"純"},{"id":1141,"en":"stable","ja":"安定した"},{"id":1142,"en":"indifferent","ja":"無関心だ"},{"id":1143,"en":"aggressive","ja":"攻撃的な"},{"id":1144,"en":"ultimate","ja":"究極の"},{"id":1145,"en":"shy","ja":"内気な"},{"id":1146,"en":"solar","ja":"太陽"},{"id":1147,"en":"profound","ja":"深い"},{"id":1148,"en":"subtle","ja":"微妙な"},{"id":1149,"en":"conservative","ja":"保守"},{"id":1150,"en":"brave","ja":"勇敢な"},{"id":1151,"en":"intense","ja":"強烈な"},{"id":1152,"en":"alcoholic","ja":"アルコールの"},{"id":1153,"en":"manual","ja":"手を使う"},{"id":1154,"en":"cruel","ja":"残酷な"},{"id":1155,"en":"rational","ja":"理性的な"},{"id":1156,"en":"initial","ja":"最初の"},{"id":1157,"en":"immune","ja":"免疫"},{"id":1158,"en":"linguistic","ja":"言語の"},{"id":1159,"en":"crucial","ja":"重大な"},{"id":1160,"en":"verbal","ja":"言葉による"},{"id":1161,"en":"optimistic","ja":"楽観的な"},{"id":1162,"en":"flexible","ja":"柔軟な"},{"id":1163,"en":"grateful","ja":"感謝している"},{"id":1164,"en":"lively","ja":"生き生きとした"},{"id":1165,"en":"overwhelming","ja":"圧倒的な"},{"id":1166,"en":"abundant","ja":"豊富な"},{"id":1167,"en":"selfish","ja":"利己的な"},{"id":1168,"en":"ugly","ja":"みにくい"},{"id":1169,"en":"racial","ja":"人種の"},{"id":1170,"en":"prominent","ja":"有名な"},{"id":1171,"en":"controversial","ja":"物議を呼ぶ"},{"id":1172,"en":"federal","ja":"連邦の"},{"id":1173,"en":"ridiculous","ja":"ばかげた"},{"id":1174,"en":"imaginary","ja":"架空の"},{"id":1175,"en":"harsh","ja":"厳しい"},{"id":1176,"en":"random","ja":"無作為な"},{"id":1177,"en":"adolescent","ja":"思春期の"},{"id":1178,"en":"up-to-date","ja":"最新の"},{"id":1179,"en":"liberal","ja":"自由主義の"},{"id":1180,"en":"prior","ja":"前 const KEY='systan1200_progress_v1', LAST_WRONG_KEY='systan1200_last_wrong_v1';
const $=id=>document.getElementById(id);
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let state={stats:{}};
let quizWords=[], idx=0, correct=0, combo=0, maxCombo=0, wrongWords=[], locked=false, timer=null;

function safeLoad(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.stats) state=x}catch(e){}}
function safeSave(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function getStat(id){return state.stats[id]||{attempts:0,correct:0,wrong:0,streak:0,last:0}}
function setStat(id,s){state.stats[id]=s;safeSave()}
function mastery(id){return Math.min(3,getStat(id).streak||0)}
function updateSummary(){let mastered=0,learning=0,att=0,cor=0;for(const w of WORDS){const s=getStat(w.id);if(s.attempts){att+=s.attempts;cor+=s.correct;if(mastery(w.id)>=3)mastered++;else learning++}}$('masteredCount').textContent=mastered;$('learningCount').textContent=learning;$('totalAccuracy').textContent=att?Math.round(cor/att*100)+'%':'—'}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
function setRange(s,e){$('startNo').value=s;$('endNo').value=e;document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',+b.dataset.s===s&&+b.dataset.e===e))}
document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>setRange(+b.dataset.s,+b.dataset.e)));
['startNo','endNo'].forEach(id=>$(id).addEventListener('input',()=>document.querySelectorAll('.preset').forEach(b=>b.classList.remove('active'))));

function sourceRange(){let s=clamp(+$('startNo').value||1,1,1200),e=clamp(+$('endNo').value||1200,1,1200);if(s>e)[s,e]=[e,s];$('startNo').value=s;$('endNo').value=e;return WORDS.filter(w=>w.id>=s&&w.id<=e)}
function chooseWords(source,count,mode){count=Math.min(count,source.length);if(mode==='number')return [...source].sort((a,b)=>a.id-b.id).slice(0,count);if(mode==='weak'){return [...source].map(w=>({w,r:Math.random(),m:mastery(w.id),wrong:getStat(w.id).wrong||0,att:getStat(w.id).attempts||0})).sort((a,b)=>a.m-b.m||b.wrong-a.wrong||a.att-b.att||a.r-b.r).slice(0,count).map(x=>x.w)}return shuffle(source).slice(0,count)}
function start(source){if(!source.length){toast('出題できる単語がありません');return}clearTimeout(timer);quizWords=source;idx=0;correct=0;combo=0;maxCombo=0;wrongWords=[];locked=false;$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function startFromSettings(){const src=sourceRange();const c=+$('questionCount').value||30;start(chooseWords(src,c,$('mode').value))}

function distractorsFor(w){const near=WORDS.filter(x=>x.id!==w.id&&x.ja!==w.ja&&Math.abs(x.id-w.id)<=90);const far=WORDS.filter(x=>x.id!==w.id&&x.ja!==w.ja);const picked=[],used=new Set([w.ja]);for(const x of shuffle(near).concat(shuffle(far))){if(!used.has(x.ja)){used.add(x.ja);picked.push(x.ja);if(picked.length===3)break}}return picked}
function render(){locked=false;const w=quizWords[idx];$('qIndex').textContent=`${idx+1} / ${quizWords.length}`;$('bar').style.width=`${idx/quizWords.length*100}%`;$('wordNo').textContent=`No.${w.id}`;$('word').textContent=w.en;$('feedback').textContent='';$('feedback').className='feedback';$('nextBtn').classList.remove('show');$('choices').innerHTML='';const opts=shuffle([w.ja,...distractorsFor(w)]);for(const o of opts){const b=document.createElement('button');b.className='choice';b.textContent=o;b.addEventListener('click',()=>answer(b,o,w));$('choices').appendChild(b)}updateSession()}
function answer(btn,selected,w){if(locked)return;locked=true;const ok=selected===w.ja;document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===w.ja)b.classList.add('correct');else if(b===btn&&!ok)b.classList.add('wrong');b.disabled=true});const s=getStat(w.id);s.attempts=(s.attempts||0)+1;s.last=Date.now();if(ok){s.correct=(s.correct||0)+1;s.streak=(s.streak||0)+1;correct++;combo++;maxCombo=Math.max(maxCombo,combo);$('feedback').textContent=masteryAfter(s)>=3?'○ 正解　★ 習得済み':'○ 正解';$('feedback').className='feedback ok'}else{s.wrong=(s.wrong||0)+1;s.streak=0;combo=0;wrongWords.push(w);$('feedback').textContent='× 正解：'+w.ja;$('feedback').className='feedback ng'}setStat(w.id,s);updateSession();if($('autoNext').checked)timer=setTimeout(next,ok?620:1050);else $('nextBtn').classList.add('show')}
function masteryAfter(s){return Math.min(3,s.streak||0)}
function next(){clearTimeout(timer);idx++;if(idx>=quizWords.length)finish();else render()}
function updateSession(){const answered=idx+(locked?1:0),wrong=Math.max(0,answered-correct);$('combo').textContent=combo;$('sessionCorrect').textContent=correct;$('sessionWrong').textContent=wrong;$('sessionAccuracy').textContent=answered?Math.round(correct/answered*100)+'%':'—'}
function uniqueWrong(){return [...new Map(wrongWords.map(w=>[w.id,w])).values()]}
function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const pct=Math.round(correct/quizWords.length*100),wrong=quizWords.length-correct,u=uniqueWrong();$('resultPct').textContent=pct+'%';$('resultSub').textContent=`${quizWords.length}問中 ${correct}問正解`;$('resultCorrect').textContent=correct;$('resultWrong').textContent=wrong;$('resultCombo').textContent=maxCombo;try{localStorage.setItem(LAST_WRONG_KEY,JSON.stringify(u.map(w=>w.id)))}catch(e){}$('wrongSection').classList.toggle('hidden',u.length===0);$('retryWrongBtn').disabled=u.length===0;$('wrongList').innerHTML='';for(const w of u){const d=document.createElement('div');d.className='wrongItem';d.innerHTML=`<b>No.${w.id} ${esc(w.en)}</b><span>${esc(w.ja)}</span>`;$('wrongList').appendChild(d)}updateSummary()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

$('startBtn').addEventListener('click',startFromSettings);$('nextBtn').addEventListener('click',next);$('backBtn').addEventListener('click',()=>{$('result').classList.add('hidden');$('setup').classList.remove('hidden');updateSummary()});$('retryWrongBtn').addEventListener('click',()=>{const u=uniqueWrong();if(u.length)start(shuffle(u))});
$('lastWrongBtn').addEventListener('click',()=>{let ids=[];try{ids=JSON.parse(localStorage.getItem(LAST_WRONG_KEY)||'[]')}catch(e){}const src=WORDS.filter(w=>ids.includes(w.id));if(src.length)start(shuffle(src));else toast('前回の間違いはありません')});
$('weakBtn').addEventListener('click',()=>{const src=sourceRange().filter(w=>mastery(w.id)<3);if(!src.length){toast('この範囲はすべて習得済みです');return}const c=Math.min(+$('questionCount').value||30,src.length);start(chooseWords(src,c,'weak'))});
$('resetBtn').addEventListener('click',()=>{if(confirm('学習履歴をすべてリセットしますか？')){state={stats:{}};safeSave();try{localStorage.removeItem(LAST_WRONG_KEY)}catch(e){}updateSummary();toast('学習履歴をリセットしました')}});
$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='systan1200_progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
$('importInput').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());const s=j.state||j;if(!s.stats)throw new Error();state=s;safeSave();updateSummary();toast('進捗を読み込みました')}catch(err){toast('進捗ファイルを読み込めませんでした')}e.target.value=''});

safeLoad();updateSummary();
</script>
