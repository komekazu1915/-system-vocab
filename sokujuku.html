document.getElementById('freeStart').onclick=startFree;document.getElementById('freeReset').onclick=()=>{freeOptions.from=1;freeOptions.to=1084;freeOptions.status='all';freePractice()};updateFreeSummary()}
function freeValid(){const f=freeOptions;return Number.isInteger(f.from)&&Number.isInteger(f.to)&&f.from>=1&&f.to<=1084&&f.from<=f.to}
function updateFreeSummary(){const n=document.getElementById('freeSummary'),b=document.getElementById('freeStart');if(!freeValid()){n.textContent='開始・終了を1〜1,084の整数で入力してください。開始番号は終了番号以下にしてください。';b.disabled=true;return}const count=freePool().length,size=freeOptions.size==='all'?count:Math.min(Number(freeOptions.size),count);n.textContent=`対象 ${count}件 / 今回 ${size}問${count?'':' · この条件の項目はありません'}`;b.disabled=count===0}
function startFree(){if(!freeValid())return;let items=freePool();if(!items.length)return;if(freeOptions.order==='random')items=shuffle(items);if(freeOptions.size!=='all')items=items.slice(0,Number(freeOptions.size));session={mode:freeOptions.mode,items,at:0,shown:false,answered:false,counts:{forgot:0,slow:0,fast:0,right:0,wrong:0},started:performance.now(),choices:null,selected:null,free:true};renderSession()}
function renderSession(){let s=session;if(s.at>=s.items.length){app.innerHTML=`<section class="panel empty"><span class="tag">SESSION COMPLETE</span><h2 style="margin-top:16px">${s.items.length}問、おつかれさま！</h2><p>${s.mode==='choice'?`正解 ${s.counts.right}問 / 不正解 ${s.counts.wrong}問`:`即答 ${s.counts.fast}問 / 遅かった ${s.counts.slow}問 / 忘れた ${s.counts.forgot}問`}</p><p class="muted">忘れた項目・遅かった項目は苦手の復習から確認できます。</p><button class="primary" id="done">${s.free?'自由練習へ':'今日の学習へ'}</button></section>`;document.getElementById('done').onclick=()=>setView(s.free?'free':'home');return}
let d=s.items[s.at];if(s.mode==='choice'&&!s.choices){let used=new Set([d.ja]);let others=shuffle(DATA.filter(x=>x.kind===d.kind&&x.id!==d.id)).filter(x=>{if(used.has(x.ja))return false;used.add(x.ja);return true}).slice(0,3);s.choices=shuffle([d,...others])}
app.innerHTML=`<section class="panel session-panel"><div class="sessionhead"><span class="muted">${s.free?'自由練習 · ':''}${s.mode==='choice'?'四択':s.mode==='reverse'?'日本語→英語':'英語→意味'} · ${s.at+1} / ${s.items.length}</span><button id="stop">終了</button></div><div class="progress"><div style="width:${s.at/s.items.length*100}%"></div></div><div class="question"><span class="tag">${label(d)}</span><h2>${esc(s.mode==='reverse'?d.ja:d.en)}</h2><button id="bookmark" aria-label="お気に入り" aria-pressed="${!!rec(d).star}">${rec(d).star?'★ お気に入り':'☆ お気に入り'}</button>${s.mode==='choice'?'':`<p class="muted">${s.mode==='reverse'?'英語の表現':'日本語の意味'}を思い出してから、答えを表示</p>`}</div>${s.mode==='choice'?`<div class="choices">${s.choices.map(x=>`<button data-choice="${x.id}" ${s.answered?'disabled':''} class="${s.answered&&x.id===d.id?'right':s.answered&&x.id===s.selected?'wrong':''}">${esc(x.ja)}</button>`).join('')}</div>${s.answered?`<p role="status">${s.selected===d.id?'✓ 正解':'正解を確認して覚え直そう'}</p>`:''}<div class="controls">${s.answered?'<button class="primary wide" id="next">次へ</button>':'<p class="muted">意味を1つ選んでください。</p>'}</div>`:`${s.shown?`<div class="answer"><b>${esc(s.mode==='reverse'?d.en:d.ja)}</b><div class="muted">答え表示まで ${(s.elapsed/1000).toFixed(1)}秒 · 自分の答えと照らし合わせよう</div></div>`:''}<div class="controls">${s.shown?'<div class="rating"><button data-rate="forgot">忘れた<small>思い出せなかった</small></button><button data-rate="slow">遅かった<small>考えて答えた</small></button><button data-rate="fast">即答できた<small>すぐ答えた</small></button></div>':'<button class="primary wide" id="show">答えを表示</button>'}<p class="key">PC：Spaceで答え表示、1・2・3で自己評価</p></div>`}</section>`;
document.getElementById('stop').onclick=()=>{if(confirm('この練習を終了しますか？回答済みの進捗は保存されます。'))setView(s.free?'free':'home')};document.getElementById('bookmark').onclick=()=>{const r=state.records[d.id]??={};r.star=!r.star;save();renderSession()};if(s.mode==='choice'){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));if(s.answered)document.getElementById('next').onclick=next}else{if(!s.shown)document.getElementById('show').onclick=()=>{s.shown=true;s.elapsed=performance.now()-s.started;renderSession()};else document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate))}}
function count(){let key=dateKey();state.days[key]=(state.days[key]||0)+1}
function rate(v){if(!session||!session.shown)return;let s=session,d=s.items[s.at],r=state.records[d.id]??={},old=r[s.mode]||{seen:0,streak:0,interval:0};let streak=v==='fast'?old.streak+1:0,interval=v==='forgot'?0:v==='slow'?1:Math.min(60,streak===1?1:streak===2?3:Math.max(7,old.interval*2));r[s.mode]={seen:old.seen+1,streak,interval,due:Date.now()+(v==='forgot'?600000:interval*DAY),last:v,ms:s.elapsed};if(v!=='fast')r.weak=true;else r.weak=false;s.counts[v]++;count();save();next()}
function choose(id){let s=session;if(!s||s.answered)return;let d=s.items[s.at],r=state.records[d.id]??={};s.answered=true;s.selected=id;let ok=id===d.id;s.counts[ok?'right':'wrong']++;r.choice={seen:(r.choice?.seen||0)+1,correct:(r.choice?.correct||0)+(ok?1:0)};if(!ok)r.weak=true;count();save();renderSession()}
function next(){if(!session)return;session.at++;session.shown=false;session.answered=false;session.started=performance.now();session.choices=null;session.selected=null;renderSession()}
function list(){app.innerHTML=`<section class="panel"><h2>熟語・構文一覧</h2><div class="form"><label style="flex:2">検索（表現・意味・通し番号）<input id="search" type="search" placeholder="例：look / 頼る / 100" value="${esc(filters.search)}"></label><label>種類<select id="listkind"><option value="all">すべて</option><option value="idiom">熟語</option><option value="structure">構文</option></select></label><label>絞り込み<select id="status"><option value="all">すべて</option><option value="weak">苦手</option><option value="star">お気に入り</option><option value="mastered">連続即答2回以上</option><option value="new">Recall未学習</option></select></label></div><div class="actions"><button id="hide">${filters.hide?'意味を表示':'意味を隠す'}</button></div><div id="results"></div></section>`;document.getElementById('listkind').value=filters.kind;document.getElementById('status').value=filters.status;document.getElementById('search').oninput=e=>{filters.search=e.target.value;listPage=0;results()};document.getElementById('listkind').onchange=e=>{filters.kind=e.target.value;listPage=0;results()};document.getElementById('status').onchange=e=>{filters.status=e.target.value;listPage=0;results()};document.getElementById('hide').onclick=()=>{filters.hide=!filters.hide;list()};results()}
function results(){const q=filters.search.trim().toLowerCase();let a=DATA.filter(d=>(filters.kind==='all'||d.kind===filters.kind)&&(!q||d.en.toLowerCase().includes(q)||d.ja.includes(q)||String(d.id)===q)&&(filters.status==='all'||filters.status==='weak'&&weak(d)||filters.status==='star'&&rec(d).star||filters.status==='mastered'&&mastered(d)||filters.status==='new'&&!rec(d).recall));let pages=Math.max(1,Math.ceil(a.length/40));listPage=Math.min(listPage,pages-1);document.getElementById('results').innerHTML=`<p class="muted">${a.length}件 · ${listPage+1} / ${pages}ページ</p><div class="list">${a.slice(listPage*40,(listPage+1)*40).map(d=>`<article class="entry"><div><span class="muted">${label(d)}${mastered(d)?' · 連続即答2回以上':weak(d)?' · 苦手':''}</span><strong>${esc(d.en)}</strong>${filters.hide?`<details><summary>意味を見る</summary><div>${esc(d.ja)}</div></details>`:`<div class="meaning">${esc(d.ja)}</div>`}</div><button data-star="${d.id}" aria-label="${d.id}のお気に入り" aria-pressed="${!!rec(d).star}">${rec(d).star?'★':'☆'}</button></article>`).join('')||'<p>該当する項目がありません。</p>'}</div><div class="actions"><button id="prev" ${listPage===0?'disabled':''}>前のページ</button><button id="more" ${listPage>=pages-1?'disabled':''}>次のページ</button></div>`;document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{let r=state.records[b.dataset.star]??={};r.star=!r.star;save();results()});document.getElementById('prev').onclick=()=>{listPage--;results();window.scrollTo(0,0)};document.getElementById('more').onclick=()=>{listPage++;results();window.scrollTo(0,0)}}
function settings(){app.innerHTML=`<section class="panel"><h2>おすすめの使い方</h2><ol><li>本で熟語・構文と例文を確認する。</li><li>「今日の学習」で英語→意味のRecallをする。</li><li>答えを確認し、正直に3段階で自己評価する。</li><li>苦手なものは四択で確認し、再びRecallで思い出す。</li><li>範囲や順番を自分で決めたいときは「自由練習」を使う。</li></ol><p>「忘れた」は10分後、「遅かった」は1日後、「即答できた」は1日→3日→7日→14日…の順で復習します（最大60日）。アプリを開いたときに復習対象になります。</p><p class="muted">「連続即答2回以上」はRecallの記録であり、完全に習得したという判定ではありません。英語→意味と日本語→英語の記録は別に管理します。四択は補助練習です。</p></section><section class="panel"><h2>進捗の保存・引き継ぎ</h2><p>進捗はこのブラウザに自動保存されます。別の端末・URL・ブラウザへ移すときは、進捗ファイルを書き出してから読み込んでください。</p><div class="actions"><button class="primary" id="export">進捗を書き出す</button><button id="import">進捗を読み込む</button><input type="file" id="file" accept="application/json,.json" hidden></div><p class="muted">シス単の進捗ファイルには対応していません。読み込みは現在の速読英熟語の進捗を置き換えます。ブラウザのデータ削除やプライベートモードでは保存が消えることがあります。</p><p id="importmsg" role="status"></p></section><section class="panel"><h2>収録データ</h2><p>熟語875件・構文209件、合計1,084件。通し番号は出典サイトの番号で、本の熟語番号・構文番号をそれぞれ表示しています。</p><p class="muted">出典一覧の明らかな誤字（「をを」・閉じ括弧・末尾の余分な点）を修正しています。内容の全件照合は手元の本との確認が必要です。例文・長文・音声は今後追加できます。</p></section>`;document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'sokujuku-recall',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`sokujuku-progress-${dateKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let msg=document.getElementById('importmsg');try{if(f.size>5000000)throw Error('サイズが大きすぎます');let p=JSON.parse(await f.text());if(p.app!=='sokujuku-recall'||p.version!==1||!validState(p.state))throw Error('速読英熟語アプリの進捗ファイルではないか、内容が壊れています');if(confirm(`現在の進捗を、読み込んだ${Object.keys(p.state.records).length}項目の進捗に置き換えますか？`)){state=p.state;save();msg.textContent='進捗を読み込みました。'}}catch(err){msg.textContent='読み込みできませんでした：'+err.message}e.target.value=''}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.addEventListener('keydown',e=>{if(!session||['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)||e.repeat)return;if(e.code==='Space'){const b=document.getElementById('show')||document.getElementById('next');if(b){e.preventDefault();b.click()}}if(session?.shown&&['1','2','3'].includes(e.key)){e.preventDefault();rate(['forgot','slow','fast'][Number(e.key)-1])}});render();
</script></body></html>
